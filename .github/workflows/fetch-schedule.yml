name: Fetch program schedule from Conference Hall

on:
  schedule:
    # Run every day at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      create_pr:
        description: 'Open a pull request when changes are detected'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  fetch-schedule:
    name: Fetch & update schedule
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: application/.node-version

      - name: Fetch schedule from Conference Hall API
        env:
          CONFERENCEHALL_API_KEY: ${{ secrets.CONFERENCEHALL_API_KEY }}
          CONFERENCEHALL_EVENT_ID: ${{ vars.CONFERENCEHALL_EVENT_ID }}
        run: node scripts/fetch-schedule.mjs

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Open pull request with updated schedule
        if: >-
          steps.changes.outputs.changed == 'true' &&
          (github.event_name == 'schedule' ||
           (github.event_name == 'workflow_dispatch' && inputs.create_pr))
        uses: peter-evans/create-pull-request@271a8d0340265e4b9d08e28efb6c4e3e1a3eb07f # v7.0.8
        with:
          commit-message: 'feat(program): update schedule from Conference Hall'
          branch: chore/update-schedule
          delete-branch: true
          title: 'feat(program): update schedule from Conference Hall'
          body: |
            Automated update of the program schedule sessions fetched from the
            [Conference Hall](https://conference-hall.io) event API.

            Triggered by: `${{ github.event_name }}`
          labels: |
            automated
            program

      - name: Commit changes directly (no PR requested)
        if: >-
          steps.changes.outputs.changed == 'true' &&
          github.event_name == 'workflow_dispatch' &&
          !inputs.create_pr
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add application/src/domains/pages/program/content/schedule.en.ts \
                  application/src/domains/pages/program/content/schedule.fr.ts
          git commit -m "feat(program): update schedule from Conference Hall"
          git push
