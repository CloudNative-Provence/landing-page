name: Fetch program schedule from Conference Hall

on:
  schedule:
    # Run every day at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  fetch-schedule:
    name: Fetch & update schedule
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # App-authenticated pull requests run CI without manual workflow approval,
      # and their merges trigger the main CI/deployment workflow.
      - name: Create schedule GitHub App token
        id: schedule-app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CI_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch schedule from Conference Hall API
        uses: $/.github/actions/fetch-schedule
        with:
          api-key: ${{ secrets.CONFERENCEHALL_API_KEY }}
          api-base: https://conference-hall.io

      - name: Create and merge pull request with updated schedule
        uses: hoverkraft-tech/ci-github-common/actions/create-and-merge-pull-request@44f6108cef0e9884ea7735f3d62932c2310745d4 # 0.39.1
        with:
          github-token: ${{ steps.schedule-app-token.outputs.token }}
          branch: chore/update-schedule
          title: "feat(program): update schedule from Conference Hall"
          body: |
            Automated update of the program schedule sessions fetched from the
            [Conference Hall](https://conference-hall.io) event API.

            Triggered by: `${{ github.event_name }}`
          commit-message: "feat(program): update schedule from Conference Hall"
