name: Fetch schedule from Conference Hall
description: >
  Fetches the event schedule from the Conference Hall API and regenerates the TypeScript schedule content files.
  The Conference Hall event ID is read automatically from application/src/config.yaml.

inputs:
  api-key:
    description: Conference Hall API key
    required: true
  api-base:
    description: Conference Hall API base URL
    required: true

runs:
  using: composite
  steps:
    - name: Fetch schedule from Conference Hall API
      uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
      with:
        script: |
          const { default: fetchSchedule } = await import('${{ github.workspace }}/scripts/fetch-schedule/index.mjs');
          await fetchSchedule({
            core,
            io,
            apiKey: '${{ inputs.api-key }}',
            apiBase: '${{ inputs.api-base }}',
            workspaceDir: '${{ github.workspace }}',
          });
