name: Fetch schedule from Conference Hall
description: >
  Fetches the event schedule from the Conference Hall API and regenerates the shared TypeScript schedule content file.
  The Conference Hall event ID is read automatically from application/src/config.yaml.

inputs:
  api-key:
    description: Conference Hall API key
    required: true
  api-base:
    description: Conference Hall API base URL
    required: true

runs:
  using: composite
  steps:
    - name: Fetch schedule from Conference Hall API
      uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
      env:
        NODE_OPTIONS: --experimental-strip-types
        CONFERENCEHALL_API_KEY: ${{ inputs.api-key }}
        CONFERENCEHALL_API_BASE: ${{ inputs.api-base }}
      with:
        script: |
          const { pathToFileURL } = await import('node:url');
          const { default: fetchSchedule } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/fetch-schedule/index.mjs`).href);
          await fetchSchedule({
            core,
            io,
            apiKey: process.env.CONFERENCEHALL_API_KEY,
            apiBase: process.env.CONFERENCEHALL_API_BASE,
            workspaceDir: process.env.GITHUB_WORKSPACE,
          });
